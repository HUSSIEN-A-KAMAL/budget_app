services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: standalone_budget_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BUDGET_HOST=0.0.0.0
      - BUDGET_SECRET_KEY=local-dev-secret-key-change-in-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
